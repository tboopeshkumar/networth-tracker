<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Send only this site's origin (never the path or query) with requests.
      Not "no-referrer": the API key is restricted to this website, and Google
      checks that restriction against the referrer — with none, the Picker
      rejects the key as "invalid".
      The Content-Security-Policy is added at build time (vite.config.ts).
    -->
    <meta name="referrer" content="strict-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Net Worth</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
