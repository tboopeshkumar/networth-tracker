<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover lets the layout use env(safe-area-inset-*) around
         the notch and home indicator when launched from the Home Screen -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Send only this site's origin (never the path or query) with requests.
      Not "no-referrer": the API key is restricted to this website, and Google
      checks that restriction against the referrer — with none, the Picker
      rejects the key as "invalid".
      The Content-Security-Policy is added at build time (vite.config.ts).
    -->
    <meta name="referrer" content="strict-origin" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light dark" />
    <title>Net Worth</title>

    <!-- Add to Home Screen. iOS ignores SVG icons and would otherwise use a
         screenshot of the page, so a real PNG is required. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Net Worth" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eeede8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
